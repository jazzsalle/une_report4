openapi: 3.1.0
info:
  title: T3Q 연계 API 요청서
  version: "2.0.0"
  description: |
    **재난상황일지 생성도구 ↔ T3Q** 연계 API 규격입니다.
    (기상요약 API-01은 v1.6에서 폐지 — 번호는 유지합니다.)

    | API | 상태 | 우리가 보내는 것 | T3Q가 돌려줄 것 |
    |---|---|---|---|
    | API-02 SOP 콘텐츠 | **T3Q 납품 (API-SOP v2, 2026-10-19 · 10-21 수정본) — 이 문서의 정본은 T3Q OpenAPI** | 재난유형·발생지역·**대응단계**·**담당부서** (위기경보는 위기경보 매뉴얼에서만) | 고른 매뉴얼 + 그 대응단계의 임무·조치·세부행동·기관·전파대상·필요자원·근거 쪽 |
    | API-03 사용자 인증 | 요청안 (T3Q 미제공) | T3Q 링크에 붙은 1회용 토큰 | 토큰 확인 결과 + 사용자 정보 |

    **API-02 (납품본) 공통 규칙** — T3Q 재난안전계획서 API와 같음
    - 주소 `https://plf.mois-disaster.t3q.ai/model-api/4920a` (우리 앱 환경변수 `T3Q_SOP_URL`, 켜기 `T3Q_SOP_MODE=live`)
    - 인증 없음 (bearer 예약). `X-Request-ID`(선택, 128자 이하)는 응답 헤더·`error.requestId`로 돌아옴
    - 재난유형은 기준정보 라벨 10종(폭염, 태풍/호우, 지진, 황사, 산불, 감염병, 가축질병, 다중밀집건축물붕괴대형사고, 정부주요시설, 학교시설) 또는 코드. 위기경보·대응단계도 한글·코드 모두
    - 선택 항목은 생략·null·빈 문자열 모두 미지정. 모르는 키는 무시하고 `warnings[]`에 `IGNORED_FIELD`
    - 오류 `{error:{code,message,retryable,retryAfter,requestId}}` — 422 입력 오류, 404 맞는 매뉴얼 없음, 429 `retryAfter` 5초

    **API-03 (요청안) 공통 규칙**
    - 인증: `Authorization: Bearer <서비스 토큰>`, 요청 헤더 `X-Request-Id`(UUID)를 응답 `meta.requestId`로
    - 문자셋 UTF-8, 시각은 ISO 8601 + KST

    **매뉴얼 ↔ JSON 대응 설명서**: [/api-docs/mapping.html](/api-docs/mapping.html) — 추출 규칙(SOP R1~R25)과 우리 화면 적용 모습.

    상세 설명 문서: `docs/T3Q_API_요청서.md`
servers:
  - url: "{T3Q_BASE_URL}/t3q/v1"
    description: API-03·04 요청안
    variables:
      T3Q_BASE_URL:
        default: https://t3q.example.go.kr
        description: T3Q 측이 알려줄 주소 (환경변수 T3Q_BASE_URL)
tags:
  - name: API-02 SOP 콘텐츠
  - name: API-03 사용자 인증
    description: |
      **T3Q 플랫폼에서 링크로 바로 들어오는 로그인**입니다. 사용자는 상황일지 도구에 따로 로그인하지 않습니다.

      **흐름**
      1. 사용자가 T3Q 플랫폼에서 「재난상황일지」 링크 클릭
      2. T3Q가 1회용 토큰을 만들어 브라우저를 아래 주소로 보냄
         `https://unereport4.vercel.app/sso/t3q?token={1회용 토큰}&next={선택: 이동할 화면, 기본 /}`
      3. 우리 서버가 `POST /auth/verify` 로 토큰을 확인하고 사용자 정보를 받음
      4. 우리 계정과 연결(처음이면 자동 생성) → 로그인 화면 없이 업무 화면으로 이동

      **T3Q에 요청하는 조건**
      - 토큰은 **1회용**, 유효시간 **5분 이내**, 확인 후 즉시 폐기
      - 기관은 **행정표준기관코드**(`orgCode`)로 주세요 — 부산광역시 `6260000`, 경상북도 `6470000`
      - `userId`는 바뀌지 않는 고유값이어야 합니다 (같은 사람 = 같은 userId)
      - 권한(`roles`)은 `USER` / `MANAGER` 만 반영합니다. 전체관리 권한은 우리 쪽에서만 부여합니다.
security:
  - bearer: []
paths:
  /reports/sop/actions:
    servers:
    - url: https://plf.mois-disaster.t3q.ai/model-api/{apiId}
      description: API-02 납품본 (T3Q API-SOP v2)
      variables:
        apiId:
          default: 4920a
    post:
      tags:
      - API-02 SOP 콘텐츠
      operationId: sopActions
      summary: 상황정보 → 고른 매뉴얼의 요청 단계·부서 임무/조치
      description: "응답 키는 협력사 API-02 정의를 따르고, `actions[].phase`·`orderHint`·`alertLevel`·`sources[].pdfIndex`·`manual.scope/region/stepBasis/departments/manualKind`는 추가 필드다.\n\n- 매뉴얼 선택: 재난유형 → 발생 시군구 매뉴얼(시군구가 여럿이면 건너뜀) → 시도 → 중앙. 같은 기관의 매뉴얼이 여러 판이면 매뉴얼 종류(표준·실무·현장조치)별로 최신판만 두고, 중앙은 위기관리 표준매뉴얼 → 위기대응 실무매뉴얼 순. 학교시설은 시도 교육청 → 중앙(교육부 우선). 없으면 404 NOT_FOUND.\n- 기관 매뉴얼: `responsibleRegion`이 행정구역이 아니라 기관명(예: `국가유산청`, 옛 이름 `문화재청`)이면 발생지역보다 먼저 그 기관의 중앙(CENTRAL) 매뉴얼을 고른다(예: `disasterType=산불`, `responsibleRegion=국가유산청`, `department=안전방재과` → 국가유산청 「산불 재난」 위기대응 실무매뉴얼). 기관 자체 조치 매뉴얼은 지역 요청에서는 고르지 않는다. 매뉴얼 보유 기관이 아닌 이름은 422, 기관은 있으나 요청 재난유형의 매뉴얼이 없으면 404.\n- 단계: stepBasis=RESPONSE_STEP이면 responseStep, ALERT_LEVEL이면 alertLevel(없으면 responseStep). 부서(R19): 그 부서가 든 부서 칸의 조치만. 없으면 초기대응부서 행 + `departmentMatched=false`(warnings에 OTHER). 조치는 선택한 매뉴얼 1종의 기재 순서(`orderHint`)를 따른다.\n- 개인정보(R17): 응답에 실명·전화번호를 싣지 않는다(발견하면 지우고 warnings에 OTHER).\n- 원문·쪽: `manual.docId`(= `sources[].docId`)로 `GET /documents/{id}/download`를 부르면 매뉴얼 PDF를 받는다. `sources[].page`는 매뉴얼에 인쇄된 쪽번호(쪽 머리글·바닥글에서 추정; 없으면 쪽 순번)라 표기용이고, 뷰어 이동은 `pdfIndex`(PDF 쪽 인덱스, 0부터)로 `GET /documents/{docId}/download?disposition=inline#page={pdfIndex + 1}`이다(보고서 API `references[].page`와 같은 쪽 = `pdfIndex + 1`).\n- R8·R17·R19·R25는 귀측 「매뉴얼 ↔ JSON 대응 설명서」(mapping.html)의 규칙 번호다.\n\n예(지역 매뉴얼):\n\n```\ncurl -sS -X POST \"https://plf.mois-disaster.t3q.ai/model-api/{apiId}/reports/sop/actions\" \\\n  -H 'Content-Type: application/json' -H 'X-Request-ID: 8a1f0c2e-5b7d-4f0e-9c1a-2d3e4f5a6b7c' \\\n  -d '{\"context\": {\"disasterType\": \"태풍/호우\", \"affectedRegions\": [\"부산광역시\"], \"responsibleRegion\": \"부산광역시\", \"responseStep\": \"SIGN_DETECTION\", \"department\": \"자연재난과\", \"alertLevel\": \"관심\", \"currentSituation\": \"태풍 북상에 따른 풍수해 징후 감지\", \"title\": \"\", \"workType\": \"\", \"period\": \"\"}}'\n```\n\n예(기관 매뉴얼):\n\n```\ncurl -sS -X POST \"https://plf.mois-disaster.t3q.ai/model-api/{apiId}/reports/sop/actions\" \\\n  -H 'Content-Type: application/json' -H 'X-Request-ID: 8a1f0c2e-5b7d-4f0e-9c1a-2d3e4f5a6b7c' \\\n  -d '{\"context\": {\"disasterType\": \"산불\", \"affectedRegions\": [], \"responsibleRegion\": \"국가유산청\", \"responseStep\": \"EMERGENCY_RESPONSE\", \"department\": \"안전방재과\", \"alertLevel\": \"심각\", \"currentSituation\": \"국가유산 인근지역 산불 발생\", \"title\": \"\", \"workType\": \"\", \"period\": \"\"}}'\n```"
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SopActionsRequest'
            examples:
              flood_busan:
                summary: 풍수해(부산광역시 현장조치 행동매뉴얼 2026.7.) · 1단계 징후감지 · 자연재난과
                value:
                  context:
                    disasterType: 태풍/호우
                    affectedRegions:
                    - 부산광역시
                    responsibleRegion: 부산광역시
                    responseStep: SIGN_DETECTION
                    department: 자연재난과
                    alertLevel: 관심
                    currentSituation: 태풍 북상에 따른 풍수해 징후 감지
                    title: ''
                    workType: ''
                    period: ''
              wildfire_nha:
                summary: 산불(국가유산청 위기대응 실무매뉴얼 2025.12.) · 심각(비상대응) · 안전방재과
                value:
                  context:
                    disasterType: 산불
                    affectedRegions: []
                    responsibleRegion: 국가유산청
                    responseStep: EMERGENCY_RESPONSE
                    department: 안전방재과
                    alertLevel: 심각
                    currentSituation: 국가유산 인근지역 산불 발생
                    title: ''
                    workType: ''
                    period: ''
      responses:
        '200':
          description: SOP 콘텐츠
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SopActionsResponse'
              examples:
                flood_busan:
                  summary: 풍수해(부산광역시 현장조치 행동매뉴얼 2026.7.) · 1단계 징후감지 · 자연재난과
                  value:
                    manual:
                      docId: ccb995a9-dd0f-4011-9616-b1504ee68817
                      docTitle: 부산광역시 「풍수해(태풍·호우·대설) 재난」 현장조치 행동매뉴얼
                      version: 2026.7.
                      scope: SIDO
                      region:
                        name: 부산광역시
                        level: SIDO
                        code: '2600000000'
                      stepBasis: RESPONSE_STEP
                      departments:
                      - 재난상황실
                      - 자연재난과
                      manualKind: 현장조치
                    departmentMatched: true
                    warnings:
                    - code: OTHER
                      message: 징후감지 단계에서 코드 번호가 없는 항목 94줄은 조치로 만들지 않았습니다(R25).
                      docId: ccb995a9-dd0f-4011-9616-b1504ee68817
                      page: 34
                    - code: UNMATCHED_TABLE
                      message: 번호가 없는 묶음 「기상상황 확인」은 하위 조치 코드가 없어 조치로 만들지 않았습니다(R25).
                      docId: ccb995a9-dd0f-4011-9616-b1504ee68817
                      page: 34
                    - code: UNMATCHED_TABLE
                      message: 번호가 없는 묶음 「조치사항 지시」은 하위 조치 코드가 없어 조치로 만들지 않았습니다(R25).
