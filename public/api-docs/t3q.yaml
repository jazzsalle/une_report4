openapi: 3.1.0
info:
  title: T3Q 연계 API 요청서
  version: "1.7.0"
  description: |
    **재난상황일지 생성도구 → T3Q** 로 요청하는 API 2종의 규격입니다.
    (기상요약 API-01은 v1.6에서 폐지 — 기상청 기상정보가 이미 문장으로 제공되어 원문을 그대로 씁니다. 번호는 유지합니다.)
    T3Q 측은 아래 경로·요청·응답 형식대로 구현해 주시기 바랍니다.

    | API | 우리가 보내는 것 | T3Q가 돌려줄 것 |
    |---|---|---|
    | API-02 SOP 콘텐츠 | 지역·재난유형·위기경보·**대응단계**·현재상황 | 해당 대응단계의 매뉴얼 기반 임무·조치·세부행동·기관·전파대상·필요자원 |
    | API-03 사용자 인증 | T3Q 링크에 붙은 1회용 토큰 | 토큰 확인 결과 + 사용자 정보(아이디·이름·기관·부서) |

    **공통 규칙**
    - 인증: `Authorization: Bearer <서비스 토큰>`
    - 문자셋 UTF-8, 시각은 ISO 8601 + KST(`2026-07-16T14:00:00+09:00`)
    - 요청 헤더 `X-Request-Id`(UUID)를 응답 `meta.requestId`로 그대로 돌려주세요.
    - 모델명은 응답 `meta.model`로만 알려 주세요 (요청 측에서 모델명을 고정하지 않습니다).
    - 출처(문서·쪽)는 보관용이며 화면 노드에는 표시하지 않습니다.

    **매뉴얼 ↔ JSON 대응 설명서**: [/api-docs/mapping.html](/api-docs/mapping.html) — 매뉴얼 어느 칸이 어느 필드가 되는지 캡처로 표시하고, 추출 규칙(R1~R17)을 정리했습니다. 부산 풍수해는 예시이며, 영천·기후부·환경부 산불·항만공사 매뉴얼로 검증한 규칙을 다른 재난유형·지자체 매뉴얼에도 같이 적용합니다.

    상세 설명 문서: `docs/T3Q_API_요청서.md`
servers:
  - url: "{T3Q_BASE_URL}/t3q/v1"
    variables:
      T3Q_BASE_URL:
        default: https://t3q.example.go.kr
        description: T3Q 측이 알려줄 주소 (환경변수 T3Q_BASE_URL)
tags:
  - name: API-02 SOP 콘텐츠
  - name: API-03 사용자 인증
    description: |
      **T3Q 플랫폼에서 링크로 바로 들어오는 로그인**입니다. 사용자는 상황일지 도구에 따로 로그인하지 않습니다.

      **흐름**
      1. 사용자가 T3Q 플랫폼에서 「재난상황일지」 링크 클릭
      2. T3Q가 1회용 토큰을 만들어 브라우저를 아래 주소로 보냄
         `https://unereport4.vercel.app/sso/t3q?token={1회용 토큰}&next={선택: 이동할 화면, 기본 /}`
      3. 우리 서버가 `POST /auth/verify` 로 토큰을 확인하고 사용자 정보를 받음
      4. 우리 계정과 연결(처음이면 자동 생성) → 로그인 화면 없이 업무 화면으로 이동

      **T3Q에 요청하는 조건**
      - 토큰은 **1회용**, 유효시간 **5분 이내**, 확인 후 즉시 폐기
      - 기관은 **행정표준기관코드**(`orgCode`)로 주세요 — 부산광역시 `6260000`, 경상북도 `6470000`
      - `userId`는 바뀌지 않는 고유값이어야 합니다 (같은 사람 = 같은 userId)
      - 권한(`roles`)은 `USER` / `MANAGER` 만 반영합니다. 전체관리 권한은 우리 쪽에서만 부여합니다.
  - name: 연계 상태
security:
  - bearer: []
paths:
  /sop/actions:
    post:
      tags: [API-02 SOP 콘텐츠]
      summary: 지역·상황·재난유형 → SOP 임무·조치
      description: |
        상황정보를 보내면, T3Q가 매뉴얼(RAG)에서 **요청한 대응단계(`context.responseStep`)**의 **임무 → 조치 → 세부행동**을 찾아
        담당·지원·협업기관, 전파대상·전파문안, 필요자원, 피해(복구)조치 구분과 함께 **한 번에** 돌려줍니다.

        - 우리 앱은 `actions` 배열을 `orderHint` 순서대로 SOP 임무 목록으로 만듭니다.
        - `actionName` → 임무명, `summary` → 임무내용, `detailTasks[].title` → 세부항목, `propagation[0].messageTemplate` → 전파 문안
        - `category=DAMAGE` 또는 `phase=RECOVERY` 인 조치는 「복구」 임무로 분류됩니다.
        - 대응단계는 매뉴얼 재난대응 프로세스 4단계입니다: 1단계 징후감지 · 2단계 초기대응 · 3단계 비상대응 · 4단계 수습·복구.
          사용자가 상황 시작 시 직접 고르며(위기경보로 추천: 관심→징후감지, 주의→초기대응, 경계·심각→비상대응), **그 단계의 조치만** 돌려주세요.
        - 각 조치에 `responseStep`·`phaseLabel`(예: "3단계 비상대응")을 함께 주세요. 상황이 다음 단계로 넘어가면 같은 API를 다음 단계로 다시 요청합니다.
        - 필수/선택 여부, 선후행 관계, 분기조건은 **요청하지 않습니다**.
      operationId: sopActions
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SopActionsRequest" }
            example:
              context:
                situationId: Xk3p9aB2cD
                workType: REAL
                responsibleRegion: { code: "2600000000", name: 부산광역시, level: SIDO }
                affectedRegions: [{ code: "2635000000", name: 부산광역시 해운대구, level: SIGUNGU }]
                disasterType: { code: TYPHOON_HEAVY_RAIN, name: 태풍/호우, group: 자연재난 }
                alertLevel: ALERT
                responseStep: EMERGENCY_RESPONSE
                baseTime: "2026-07-16T14:30:00+09:00"
                title: 26.07.16. 부산 호우 대응
                currentSituation: 해운대구 저지대 도로 일부 침수 신고 접수
                period: { start: "2026-07-16T14:00:00+09:00" }
              filter: { maxActions: 40 }
      responses:
        "200":
          description: SOP 콘텐츠 (조치 목록 + 상세 1회 응답)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SopActionsResponse" }
              example:
                meta:
                  requestId: a9f2c1d4-0e6b-4d71-8c3a-6b2f9e7d1c55
                  traceId: t3q-sop-20260716-000456
                  generatedAt: "2026-07-16T14:31:08+09:00"
                  model: t3q-sop-v1
                  mock: false
                disasterType: { code: TYPHOON_HEAVY_RAIN, name: 태풍/호우, group: 자연재난 }
                missions:
                  - { missionCode: M01, missionName: 상황관리, leadOrg: 시민안전실 자연재난과, actionCodes: [HR-R-001] }
                  - { missionCode: M02, missionName: 인명보호, leadOrg: 해운대구 안전총괄과, actionCodes: [HR-R-002] }
                  - { missionCode: M03, missionName: 수습·복구, leadOrg: 시민안전실 자연재난과, actionCodes: [HR-D-001] }
                actions:
                  - actionCode: HR-R-001
                    actionName: 재난안전대책본부 비상 2단계 가동 및 상황 전파
                    phase: RESPONSE
                    phaseLabel: 3단계 비상대응
                    responseStep: EMERGENCY_RESPONSE
                    category: RESPONSE
                    missionCode: M01
                    orderHint: 1
                    summary: 호우경보 발효에 따라 비상 2단계 근무체계로 전환하고 유관기관에 상황을 전파한다.
                    organizations:
                      - { name: 시민안전실 자연재난과, role: LEAD }
                      - { name: 16개 구·군 재난안전과, role: SUPPORT }
                      - { name: 부산지방기상청, role: COOPERATE }
                    detailTasks:
                      - { seq: 1, title: 비상근무 인원 소집, content: 비상 2단계 근무명령에 따라 협업부서 인원을 소집한다. }
                      - { seq: 2, title: 기상상황 모니터링, content: 강우량·하천수위를 1시간 단위로 확인하여 상황판에 게시한다., note: 특보 해제 시까지 }
                    propagation:
                      - target: 16개 구·군 재난안전과
                        targetType: ORG
                        channelHint: SMS
                        messageTemplate: "[부산시] 호우경보 발효(7.16. 14:00). 비상 2단계 근무 돌입, 취약지역 예찰 강화 바랍니다."
                    resources:
                      - { category: 인력, name: 비상근무 인원, quantity: 20, unit: 명 }
                    sources:
                      - { docId: DOC-BUSAN-FLOOD-2026, docTitle: 부산시 풍수해 재난 현장조치 행동매뉴얼, page: 150 }
                  - actionCode: HR-R-002
                    actionName: 침수 우려 지하차도·하천변 출입 통제
                    phase: RESPONSE
                    phaseLabel: 3단계 비상대응
                    responseStep: EMERGENCY_RESPONSE
                    category: RESPONSE
                    missionCode: M02
                    orderHint: 2
                    summary: 침수 우려 지하차도와 하천변 산책로의 출입을 통제한다.
                    organizations:
                      - { name: 해운대구 안전총괄과, role: LEAD }
                      - { name: 해운대경찰서, role: COOPERATE }
                    detailTasks:
                      - { seq: 1, title: 지하차도 차량 통제, content: 수위 기준 초과 시 진입 차단기를 작동하고 우회 안내한다. }
                      - { seq: 2, title: 하천변 산책로 통제, content: 출입구 통제선 설치 및 현장 안내요원을 배치한다. }
                    propagation:
                      - target: 읍면동 주민
                        targetType: PUBLIC
                        channelHint: BROADCAST
                        messageTemplate: 호우경보로 하천변 산책로 및 지하차도 출입을 통제합니다.
                    resources:
                      - { category: 장비, name: 통제선·차단기, quantity: 10, unit: 개소 }
                      - { category: 인력, name: 현장 안내요원, quantity: 8, unit: 명 }
                    sources:
                      - { docId: DOC-BUSAN-FLOOD-2026, docTitle: 부산시 풍수해 재난 현장조치 행동매뉴얼, page: 162 }
                  - actionCode: HR-D-001
                    actionName: 피해 상황 조사 및 NDMS 입력
                    phase: RECOVERY
                    phaseLabel: 4단계 수습·복구
                    responseStep: RECOVERY
                    category: DAMAGE
                    missionCode: M03
                    orderHint: 3
                    summary: 인명·재산 피해를 조사하여 NDMS에 입력하고 보고한다.
                    organizations:
                      - { name: 시민안전실 자연재난과, role: LEAD }
                      - { name: 16개 구·군 재난안전과, role: SUPPORT }
                    detailTasks:
                      - { seq: 1, title: 구·군 피해 현황 취합, content: 구·군별 인명·주택·공공시설 피해를 취합한다. }
                      - { seq: 2, title: NDMS 피해 입력, content: 행정안전부 보고 시각(05·10·17·22시) 전 NDMS에 입력한다. }
                    propagation: []
                    resources: []
                    sources:
                      - { docId: DOC-BUSAN-FLOOD-2026, docTitle: 부산시 풍수해 재난 현장조치 행동매뉴얼, page: 201 }
                organizationSummary:
                  - { name: 시민안전실 자연재난과, roles: [LEAD], actionCodes: [HR-R-001, HR-D-001] }
                  - { name: 해운대구 안전총괄과, roles: [LEAD], actionCodes: [HR-R-002] }
        "4XX": { $ref: "#/components/responses/Error" }
        "5XX": { $ref: "#/components/responses/Error" }

  /auth/verify:
    post:
      tags: [API-03 사용자 인증]
      summary: 링크 토큰 확인 → 사용자 정보
      description: 우리 서버(`/sso/t3q`)가 서버 간 통신으로 호출합니다. 브라우저에서 직접 호출하지 않습니다.
      operationId: authVerify
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthVerifyRequest" }
            example: { token: "t3q-ott-8f2b0c7e4a1d4b6f9e3c" }
      responses:
        "200":
          description: 확인된 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthVerifyResponse" }
              example:
                meta: { requestId: 3b7f0c2e-1d4a-4e8b-9c6f-2a5d7e9b1c04, traceId: t3q-auth-20261005-000101, generatedAt: "2026-10-05T09:00:03+09:00" }
                user:
                  userId: U2026000123
                  loginId: hong.gildong
                  name: 홍길동
                  orgCode: "6260000"
                  orgName: 부산광역시
                  deptName: 시민안전실 자연재난과
                  position: 주무관
                  email: hong@busan.go.kr
                  roles: [USER]
                expiresAt: "2026-10-05T17:00:00+09:00"
        "401":
          description: 토큰 없음·만료·이미 사용됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/T3QError" }
              example:
                error: { code: INVALID_TOKEN, message: 만료되었거나 이미 사용된 토큰입니다. }
                meta: { requestId: 3b7f0c2e-1d4a-4e8b-9c6f-2a5d7e9b1c04, traceId: t3q-auth-20261005-000102 }
        "5XX": { $ref: "#/components/responses/Error" }

  /health:
    get:
      tags: [연계 상태]
      summary: 연계 상태 확인
      operationId: health
      responses:
        "200":
          description: 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [UP, DEGRADED, DOWN] }
                  services:
                    type: object
                    properties:
                      weather: { type: string, enum: [UP, DOWN] }
                      sop: { type: string, enum: [UP, DOWN] }
                  checkedAt: { type: string, format: date-time }
              example: { status: UP, services: { weather: UP, sop: UP }, checkedAt: "2026-07-16T14:00:00+09:00" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: T3Q 측이 발급하는 서비스 계정 토큰
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      description: 요청 추적용 UUID. 응답 meta.requestId 로 그대로 반환
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: 오류
      content:
        application/json:
          schema: { $ref: "#/components/schemas/T3QError" }
          example:
            error: { code: NO_DOCUMENT, message: 재난유형·지역에 맞는 매뉴얼이 없습니다. }
            meta: { requestId: a9f2c1d4-0e6b-4d71-8c3a-6b2f9e7d1c55, traceId: t3q-sop-20260716-000457 }
  schemas:
    WorkType:
      type: string
      enum: [REAL, DRILL]
      description: "REAL: 실제재난 / DRILL: 안전한국훈련"
    AlertLevelCode:
      type: string
      enum: [INTEREST, CAUTION, ALERT, SERIOUS]
      description: "위기경보 수준 — 관심 / 주의 / 경계 / 심각 (보고용 사실 정보)"
    ResponseStepCode:
      type: string
      enum: [SIGN_DETECTION, INITIAL_RESPONSE, EMERGENCY_RESPONSE, RECOVERY]
      description: |
        대응단계 — SOP 구성 기준
        | 코드 | 단계 | 매뉴얼 ★ 위기경보 |
        |---|---|---|
        | SIGN_DETECTION | 1단계 징후감지 | 관심·주의 |
        | INITIAL_RESPONSE | 2단계 초기대응 | 주의 |
        | EMERGENCY_RESPONSE | 3단계 비상대응 | 경계·심각 |
        | RECOVERY | 4단계 수습·복구 | 경계·심각 |
    DisasterType:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          description: |
            재난유형 코드 (10종)
            | 코드 | 재난유형 | 구분 |
            |---|---|---|
            | HEAT_WAVE | 폭염 | 자연재난 |
            | TYPHOON_HEAVY_RAIN | 태풍/호우 | 자연재난 |
            | EARTHQUAKE | 지진 | 자연재난 |
            | YELLOW_DUST | 황사 | 자연재난 |
            | WILDFIRE | 산불 | 사회재난 |
            | INFECTIOUS_DISEASE | 감염병 | 사회재난 |
            | LIVESTOCK_DISEASE | 가축질병 | 사회재난 |
            | CROWDED_BUILDING_COLLAPSE | 다중밀집건축물붕괴대형사고 | 사회재난 |
            | GOV_MAJOR_FACILITY | 정부주요시설 | 사회재난 |
            | SCHOOL_FACILITY | 학교시설 | 사회재난 |
          enum: [HEAT_WAVE, TYPHOON_HEAVY_RAIN, EARTHQUAKE, YELLOW_DUST, WILDFIRE, INFECTIOUS_DISEASE, LIVESTOCK_DISEASE, CROWDED_BUILDING_COLLAPSE, GOV_MAJOR_FACILITY, SCHOOL_FACILITY]
        name: { type: string, example: 태풍/호우 }
        group: { type: string, enum: [자연재난, 사회재난] }
    Region:
      type: object
      required: [code, name, level]
      properties:
        code: { type: string, description: "법정동 코드 10자리 — 시도 2자리+0 (예 2600000000), 시군구 5자리+0 (예 2635000000). 읍면동은 시군구 코드로 보냄" }
        name: { type: string }
        level: { type: string, enum: [SIDO, SIGUNGU, EUPMYEONDONG] }
    SituationContext:
      type: object
      description: API-02 상황정보
      required: [situationId, workType, responsibleRegion, disasterType, alertLevel, responseStep, baseTime]
      properties:
        situationId: { type: string, description: 우리 앱의 상황 ID }
        workType: { $ref: "#/components/schemas/WorkType" }
        responsibleRegion: { $ref: "#/components/schemas/Region" }
        affectedRegions: { type: array, items: { $ref: "#/components/schemas/Region" }, description: "발생지역 (전국 시군구·읍면동). name 은 '부산광역시 해운대구 우동' 처럼 시도부터 전체 표기" }
        disasterType: { $ref: "#/components/schemas/DisasterType" }
        alertLevel: { $ref: "#/components/schemas/AlertLevelCode" }
        responseStep: { $ref: "#/components/schemas/ResponseStepCode" }
        baseTime: { type: string, format: date-time, description: 기준시각 }
        title: { type: string, description: 상황 제목 }
        currentSituation: { type: string, description: 현재상황 (참고용 자유 텍스트, 사실로 취급하지 않음) }
        period:
          type: object
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
    T3QMeta:
      type: object
      required: [requestId, traceId, generatedAt]
      properties:
        requestId: { type: string }
        traceId: { type: string, description: T3Q 내부 추적 ID }
        generatedAt: { type: string, format: date-time }
        model: { type: string, description: 참고 표시용 모델명 }
        mock: { type: boolean }
        elapsedMs: { type: integer }
    T3QError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, UNAUTHORIZED, INVALID_TOKEN, NO_DOCUMENT, NO_ALERT_CONTEXT, RATE_LIMITED, INTERNAL_ERROR, MODEL_UNAVAILABLE, TIMEOUT]
            message: { type: string }
            detail: {}
        meta:
          type: object
          properties:
            requestId: { type: string }
            traceId: { type: string }

    SopActionsRequest:
      type: object
      required: [context]
      properties:
        context: { $ref: "#/components/schemas/SituationContext" }
        filter:
          type: object
          properties:
            phases: { type: array, items: { $ref: "#/components/schemas/ResponsePhase" } }
            categories: { type: array, items: { type: string, enum: [RESPONSE, DAMAGE] } }
            maxActions: { type: integer, default: 40 }
    ResponsePhase:
      type: string
      enum: [PREVENTION, PREPAREDNESS, RESPONSE, RECOVERY]
      description: 예방 / 대비 / 대응 / 복구
    OrgRef:
      type: object
      required: [name, role]
      properties:
        name: { type: string, example: 시민안전실 자연재난과 }
        role: { type: string, enum: [LEAD, SUPPORT, COOPERATE], description: 담당(주관) / 지원 / 협업 }
        orgCode: { type: string, description: 행정표준기관코드 (가능 시) }
    DetailTask:
      type: object
      required: [seq, title, content]
      properties:
        seq: { type: integer }
        title: { type: string, description: 세부행동 (화면 세부항목) }
        content: { type: string }
        note: { type: string, description: 시점·기준 등 비고 }
    PropagationTarget:
      type: object
      required: [target, targetType]
      properties:
        target: { type: string, description: 전파대상 (참고정보 — 실제 수신자는 사용자가 연락망에서 지정) }
        method: { type: string, description: "매뉴얼 전파 표의 구분·전파방법 원문 (예: UMS — 휴대전화 문자메시지(SMS) 발송)" }
        targetType: { type: string, enum: [ORG, ROLE, PUBLIC] }
        channelHint: { type: string, enum: [SMS, EMAIL, BROADCAST, PHONE] }
        messageTemplate: { type: string, description: 전파 문안 초안 }
    ResourceNeed:
      type: object
      required: [category, name]
      properties:
        category: { type: string, description: "인력 · 장비 · 물자 · 시설" }
        name: { type: string }
        quantity: { type: number }
        unit: { type: string }
    SourceRef:
      type: object
      required: [docId, docTitle]
      properties:
        docId: { type: string }
        docTitle: { type: string }
        page: { type: integer, description: 매뉴얼 인쇄 쪽번호 }
        excerpt: { type: string, maxLength: 200 }
    SopAction:
      type: object
      description: "조치 [n-m] 1건 = 화면의 SOP 항목 1개 (매뉴얼 대응: /api-docs/mapping.html)"
      required: [actionCode, actionName, phase, category, missionCode, orderHint, organizations, detailTasks, propagation, resources, sources]
      properties:
        actionCode: { type: string, description: "매뉴얼 조치 코드번호 그대로 (예: 3-1). 같은 문서 버전이면 같은 코드" }
        actionName: { type: string, description: "조치명 — 재난대응 프로세스의 [n-m] 줄 (예: 기상특보 상황 파악)" }
        phase: { $ref: "#/components/schemas/ResponsePhase" }
        phaseLabel: { type: string, description: "매뉴얼 원문 단계명 (예: 3단계 비상대응)" }
        responseStep: { $ref: "#/components/schemas/ResponseStepCode" }
        category: { type: string, enum: [RESPONSE, DAMAGE], description: 대응조치 / 피해(복구)조치 }
        missionCode: { type: string, description: "상위 임무 [n]의 번호 (예: 3)" }
        condition: { type: string, description: "수행 조건 — (필요시), ＊태풍 북상 우려시 등 원문 그대로. 없으면 생략" }
        notes: { type: array, items: { type: string }, description: "비고 — 매뉴얼의 ※·* 줄 (기호 제외), 「관심단계 참고」 같은 상속 표시" }
        linkedActionCodes: { type: array, items: { type: string }, description: "행동카드 연계코드 (범위 a ~ b 는 펼쳐서)" }
        orderHint: { type: integer, description: 매뉴얼 기재 순서 (선후행 관계 아님) }
        summary: { type: string, description: 조치 요약 → 임무내용 }
        organizations: { type: array, items: { $ref: "#/components/schemas/OrgRef" } }
        detailTasks: { type: array, items: { $ref: "#/components/schemas/DetailTask" } }
        propagation: { type: array, items: { $ref: "#/components/schemas/PropagationTarget" } }
        resources: { type: array, items: { $ref: "#/components/schemas/ResourceNeed" } }
        sources: { type: array, items: { $ref: "#/components/schemas/SourceRef" } }
    SopMission:
      type: object
      required: [missionCode, missionName, actionCodes]
      properties:
        missionCode: { type: string, description: "임무 번호 [n] (예: 3). 원문자는 숫자로 (①-1 → 1-1)" }
        missionName: { type: string, example: 기상특보 전파 }
        functionCode: { type: string, description: "협업기능 번호 (행안부 표준 ①~⑬ → 1~13). 해당 없으면 생략" }
        functionName: { type: string, example: 재난상황관리 }
        responseStep: { $ref: "#/components/schemas/ResponseStepCode" }
        leadOrg: { type: string }
        actionCodes: { type: array, items: { type: string } }
    SopActionsResponse:
      type: object
      required: [meta, disasterType, missions, actions]
      properties:
        meta: { $ref: "#/components/schemas/T3QMeta" }
        disasterType: { $ref: "#/components/schemas/DisasterType" }
        missions: { type: array, items: { $ref: "#/components/schemas/SopMission" } }
        actions: { type: array, items: { $ref: "#/components/schemas/SopAction" } }
        organizationSummary:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              roles: { type: array, items: { type: string, enum: [LEAD, SUPPORT, COOPERATE] } }
              actionCodes: { type: array, items: { type: string } }

    AuthVerifyRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, description: T3Q 링크에 붙은 1회용 토큰 }
    T3QUser:
      type: object
      required: [userId, name, orgName]
      properties:
        userId: { type: string, description: 변하지 않는 사용자 고유값 }
        loginId: { type: string, description: T3Q 로그인 아이디 (참고) }
        name: { type: string }
        orgCode: { type: string, description: "행정표준기관코드 — 부산광역시 6260000 · 경상북도 6470000" }
        orgName: { type: string }
        deptName: { type: string, description: "부서 (예: 시민안전실 자연재난과)" }
        position: { type: string, description: 직위 }
        email: { type: string }
        roles: { type: array, items: { type: string, enum: [USER, MANAGER, ADMIN] }, description: "USER 일반 · MANAGER 기관관리 (ADMIN은 반영하지 않음)" }
    AuthVerifyResponse:
      type: object
      required: [meta, user]
      properties:
        meta: { $ref: "#/components/schemas/T3QMeta" }
        user: { $ref: "#/components/schemas/T3QUser" }
        expiresAt: { type: string, format: date-time, description: T3Q 세션 만료 시각 }
