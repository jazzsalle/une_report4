        apiId:
          default: 4920a
    get:
      tags:
      - API-02 SOP 콘텐츠
      operationId: health
      summary: 상태 확인
      description: 운영용 기동 확인. 보고서 API와 한 배포라 응답도 같다(`app`은 배포 이름). prefix 없이 `/health`와 `/`로도 응답한다.
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                app: 재난안전 보고서 생성 API v2
                version: 2.0.0
                status: ok
      security: []

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: T3Q 측이 발급하는 서비스 계정 토큰
  parameters:
    Disposition:
      name: disposition
      in: query
      required: false
      schema:
        type: string
        enum:
        - attachment
        - inline
        default: attachment
      description: '`attachment`(기본) 내려받기, `inline` 브라우저 PDF 뷰어로 열기(PDF에만 적용)'
    DocumentId:
      name: id
      in: path
      required: true
      description: 매뉴얼 문서 ID(`manual.docId` = `sources[].docId`). 보고서 API의 청크 ID·파일 ID도 같은 자리에 쓴다
      schema:
        type: string
        minLength: 1
        maxLength: 128
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 요청 추적 ID
      schema:
        type: string
        maxLength: 128
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      description: 요청 추적용 UUID. 응답 meta.requestId 로 그대로 반환
      schema: { type: string, format: uuid }
  responses:
    ServiceUnavailable:
      description: '서비스 불가 (`SERVICE_UNAVAILABLE`): 매뉴얼 저장소 설정 누락·연결 실패(다운로드는 문서 저장소 설정 누락)'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: SOP 매뉴얼 저장소에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.
              retryable: true
              retryAfter: null
              requestId: 8a1f0c2e-5b7d-4f0e-9c1a-2d3e4f5a6b7c
    PayloadTooLarge:
      description: 본문 1 MiB 초과 (`PAYLOAD_TOO_LARGE`)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: 요청 본문이 너무 큽니다(최대 1 MiB).
              retryable: false
              retryAfter: null
              requestId: 8a1f0c2e-5b7d-4f0e-9c1a-2d3e4f5a6b7c
    InvalidRequest:
      description: '요청 위반 (`INVALID_REQUEST`): 잘못된 JSON·본문이 객체가 아님·필수 누락·허용값 밖(재난유형 10종 밖 포함)·`responsibleRegion`을 행정구역이나 매뉴얼 보유 기관으로 해석할 수 없음·기관명과 행정구역 `code`가 함께 옴(모순). 다운로드는 `id`·`disposition` 형식 위반'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownDisasterType:
              summary: 재난유형 10종 밖(disasterType=`기타`)
              value:
                error:
                  code: INVALID_REQUEST
                  message: 'context.disasterType: 허용되지 않는 값 ''기타''입니다. 허용값: 폭염, 태풍/호우, 지진, 황사, 산불, 감염병, 가축질병, 다중밀집건축물붕괴대형사고, 정부주요시설, 학교시설'
                  retryable: false
                  retryAfter: null
                  requestId: 8a1f0c2e-5b7d-4f0e-9c1a-2d3e4f5a6b7c
            enum:
              summary: 허용값 밖(responseStep=`NORMAL`)
              value:
                error:
                  code: INVALID_REQUEST
                  message: 'context.responseStep: 허용되지 않는 값 ''NORMAL''입니다. 허용값: SIGN_DETECTION, INITIAL_RESPONSE, EMERGENCY_RESPONSE, RECOVERY'
                  retryable: false
                  retryAfter: null
                  requestId: 8a1f0c2e-5b7d-4f0e-9c1a-2d3e4f5a6b7c
            missingContext:
              summary: '`context` 없음'
              value:
                error:
                  code: INVALID_REQUEST
                  message: 'context: 필수 값입니다.'
                  retryable: false
                  retryAfter: null
                  requestId: 8a1f0c2e-5b7d-4f0e-9c1a-2d3e4f5a6b7c
            unknownAgency:
              summary: 기관명 오류(responsibleRegion=`아무기관`)
              value:
                error:
                  code: INVALID_REQUEST
                  message: 'context.responsibleRegion: 행정구역이나 매뉴얼 보유 기관으로 해석할 수 없습니다: ''아무기관'''
                  retryable: false
                  retryAfter: null
                  requestId: 8a1f0c2e-5b7d-4f0e-9c1a-2d3e4f5a6b7c
    RateLimited:
      description: 요청 한도 초과 (`RATE_LIMIT`). SOP는 `retryAfter` 5초(보고서 API는 30초)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMIT
              message: 요청 한도를 초과했습니다. 5초 후 다시 시도해 주세요.
              retryable: true
              retryAfter: 5
              requestId: 8a1f0c2e-5b7d-4f0e-9c1a-2d3e4f5a6b7c
    NotFound:
      description: 요청 조건에 맞는 매뉴얼 없음 (`NOT_FOUND`). 기관 요청이면 그 기관의 요청 재난유형 매뉴얼이 없음. 다운로드는 `id`에 해당하는 문서·파일 없음
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: 요청 조건에 맞는 매뉴얼이 없습니다.
              retryable: false
              retryAfter: null
              requestId: 8a1f0c2e-5b7d-4f0e-9c1a-2d3e4f5a6b7c
    InternalError:
      description: 서버 오류 (`UNKNOWN`)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNKNOWN
              message: 처리 중 오류가 발생했습니다.
              retryable: false
              retryAfter: null
              requestId: 8a1f0c2e-5b7d-4f0e-9c1a-2d3e4f5a6b7c
    Error:
      description: 오류
      content:
        application/json:
          schema: { $ref: "#/components/schemas/T3QError" }
          example:
            error: { code: NO_DOCUMENT, message: 재난유형·지역에 맞는 매뉴얼이 없습니다. }
            meta: { requestId: a9f2c1d4-0e6b-4d71-8c3a-6b2f9e7d1c55, traceId: t3q-sop-20260716-000457 }
  headers:
    RetryAfter:
      description: 재시도까지 대기 초
      schema:
        type: integer
        minimum: 0
    XRequestId:
      schema:
        type: string
  schemas:
    SopActionsRequest:
      type: object
      required:
      - context
      description: 요청 본문. 상황정보를 `context` 하나에 담는다. 그 밖의 최상위 키는 무시하고 `IGNORED_FIELD` 경고로 알린다.
      properties:
        context:
          $ref: '#/components/schemas/SopContext'
    SopContext:
      type: object
      required:
      - disasterType
      - responseStep
      description: '상황정보. `responsibleRegion`·`affectedRegions` 중 하나는 값이 있어야 한다(둘 다 미지정이면 422). `currentSituation`·`title`·`workType`·`period`·`situationId`·`baseTime`은 참고용으로 받기만 하고 매뉴얼 선택에 쓰지 않는다. 형식은 협력사 API-02 Swagger와 같으며(`period` `{start, end}` date-time, `baseTime` date-time, `workType` REAL|DRILL), 형식이 어긋나도 422가 아니라 `IGNORED_FIELD`(message = 키 경로, 예: `context.period.start`)로 알리고 무시한다. 그 밖의 키는 무시하고 `IGNORED_FIELD`(message 예: `context.foo`).'
      anyOf:
      - required:
        - responsibleRegion
      - required:
        - affectedRegions
      properties:
        disasterType:
          type: string
          enum:
          - 폭염
          - 태풍/호우
          - 지진
          - 황사
          - 산불
          - 감염병
          - 가축질병
          - 다중밀집건축물붕괴대형사고
          - 정부주요시설
          - 학교시설
          - HEAT_WAVE
          - TYPHOON_HEAVY_RAIN
          - EARTHQUAKE
          - YELLOW_DUST
          - WILDFIRE
          - INFECTIOUS_DISEASE
          - LIVESTOCK_DISEASE
          - CROWDED_BUILDING_COLLAPSE
          - GOV_MAJOR_FACILITY
          - SCHOOL_FACILITY
          description: '재난유형 10종의 표시 이름 또는 코드: `폭염`(HEAT_WAVE), `태풍/호우`(TYPHOON_HEAVY_RAIN), `지진`(EARTHQUAKE), `황사`(YELLOW_DUST), `산불`(WILDFIRE), `감염병`(INFECTIOUS_DISEASE), `가축질병`(LIVESTOCK_DISEASE), `다중밀집건축물붕괴대형사고`(CROWDED_BUILDING_COLLAPSE), `정부주요시설`(GOV_MAJOR_FACILITY), `학교시설`(SCHOOL_FACILITY). 허용값은 이 enum 값이며, 공백·구분기호 차이는 서버가 정규화해 받지만 스키마 enum은 정확한 값만 허용한다. `기타`·`대형화재`·`공연장·경기장·지역축제`·코드 `ETC` 등 그 밖의 값은 422 INVALID_REQUEST'
        affectedRegions:
          type: array
          items:
            type: string
          nullable: true
          description: '발생지역 이름 목록(시도부터 전체 표기 권장). 예: `부산광역시`, `부산광역시 해운대구 우동`, 별칭 `부산시`·`부산`. 시군구가 하나면 그 시군구 매뉴얼, 여럿이면 시도 매뉴얼. 시도를 정할 수 없는 이름은 422'
        responsibleRegion:
          type: string
          nullable: true
          description: '관할지역 이름 또는 기관명. 이름이 행정구역(시도·시군구)으로 해석되지 않으면 중앙부처 기관명으로 본다: 공백·가운뎃점 무시, 별칭 `문화재청`→`국가유산청`, 매뉴얼 기관명과 정확히 같거나 `본체(부서)` 꼴 기관명의 본체와 같으면 일치(괄호 안 부서명·접두 일치는 기관으로 보지 않음). 기관명이면 발생지역보다 먼저 그 기관의 매뉴얼을 고른다. 매뉴얼 보유 기관이 아니면 422 INVALID_REQUEST, 기관은 있으나 요청 재난유형의 매뉴얼이 없으면 404 NOT_FOUND'
        responseStep:
          type: string
          enum:
          - SIGN_DETECTION
          - INITIAL_RESPONSE
          - EMERGENCY_RESPONSE
          - RECOVERY
          - 징후감지
          - 초기대응
          - 비상대응
          - 수습복구
          description: 대응단계 코드 또는 한글. 허용값은 이 enum 값이며, 공백·구분기호 차이는 서버가 정규화해 받지만 스키마 enum은 정확한 값만 허용한다. 허용값 밖이면 422
        alertLevel:
          type: string
          nullable: true
          enum:
          - 관심
          - 주의
          - 경계
          - 심각
          - INTEREST
          - CAUTION
          - ALERT
          - SERIOUS
          - null
          description: (선택) 위기경보 — 한글 또는 코드. 허용값은 이 enum 값이며, 공백·구분기호 차이는 서버가 정규화해 받지만 스키마 enum은 정확한 값만 허용한다. 생략·null은 미지정(빈 문자열은 스키마상 유효하지 않지만 서버가 미지정으로 처리한다. 신규 연동은 생략 또는 null). 매뉴얼 단계가 위기경보로 나뉜 경우(stepBasis=ALERT_LEVEL)에만 단계 선택에 쓴다
        department:
          type: string
          nullable: true
          description: (선택) 담당부서 원문(R19). 띄어쓰기·가운뎃점 무시, 상위 조직 접두 허용(`시민안전실 자연재난과`). 미지정이면 그 단계의 조치 전부
        currentSituation:
          type: string
          nullable: true
          description: (참고용) 현재상황 자유 텍스트. 사실로 취급하지 않는다
        title:
          type: string
          nullable: true
          description: (참고용) 상황 제목
        workType:
          type: string
          nullable: true
          enum:
          - REAL
          - DRILL
          - ''
          - null
          description: '(참고용) 업무유형: `REAL` 실제재난, `DRILL` 안전한국훈련(협력사 Swagger WorkType). 생략·null·빈 문자열은 미지정. 그 밖의 값은 `IGNORED_FIELD`(`context.workType`)'
        period:
          nullable: true
          description: (참고용) 대응 기간. `{start, end}` 객체(각각 date-time, `end` 없음·null은 종료 미정). 생략·null·빈 문자열은 미지정. 객체의 그 밖의 키나 date-time이 아닌 값은 `IGNORED_FIELD`(`context.period.<키>`), 객체·빈 문자열이 아닌 값은 `IGNORED_FIELD`(`context.period`)
          anyOf:
          - type: object
            properties:
              start:
                type: string
                nullable: true
                format: date-time
              end:
                type: string
                nullable: true
                format: date-time
          - type: string
            enum:
            - ''
            description: 빈 문자열 = 미지정(협력사 정본 요청 형태)
        situationId:
          type: string
          nullable: true
          description: (참고용) 호출 측 상황 ID
        baseTime:
          type: string
          nullable: true
          format: date-time
          description: (참고용) 기준시각. date-time이 아니면 `IGNORED_FIELD`(`context.baseTime`)
    SopActionsResponse:
      type: object
      required:
      - manual
      - departmentMatched
      - warnings
      - missions
      - actions
      properties:
        manual:
          $ref: '#/components/schemas/SopManual'
        departmentMatched:
          type: boolean
          description: 요청 부서의 행이 이 단계에 있었는지. false면 초기대응부서(총괄) 행으로 대신함
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/SopWarning'
        missions:
          type: array
          items:
            $ref: '#/components/schemas/SopMission'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/SopAction'
    SopManual:
      type: object
      required:
      - docId
      - docTitle
      - version
      - scope
      - region
      - stepBasis
      - departments
      - manualKind
      properties:
        docId:
          type: string
          description: 매뉴얼 문서 ID. 보고서 API `references[].fileId`와 같은 체계의 값이며, 원문 PDF는 `GET /documents/{id}/download`의 `id`에 이 값을 그대로 넣어 받는다
        docTitle:
          type: string
          description: '기관명 + 매뉴얼 제목(예: `부산광역시 「풍수해(태풍·호우·대설) 재난」 현장조치 행동매뉴얼`). 제목에 기관명이 이미 있으면 덧붙이지 않는다'
        version:
          type: string
          description: '판·기준일 원문(예: 2026.7.)'
        scope:
          type: string
          enum:
          - SIGUNGU
          - SIDO
          - CENTRAL
          - OTHER
          description: 매뉴얼 범위(선택 근거). OTHER는 시도 교육청(학교시설만)
        region:
          type: object
          properties:
            code:
              type: string
              description: 법정동 코드 10자리(시도·시군구 매뉴얼). 중앙 매뉴얼은 없음
            name:
              type: string
            level:
              type: string
              description: 'SIDO·SIGUNGU·OTHER(시도 교육청) 또는 CENTRAL(중앙부처·기관 매뉴얼: name = 매뉴얼 기관명 원문)'
        stepBasis:
          type: string
          enum:
          - RESPONSE_STEP
          - ALERT_LEVEL
          description: '매뉴얼 단계 구분: 대응단계 또는 위기경보'
        departments:
          type: array
          items:
            type: string
          description: 응답 조치의 부서(없으면 부서 칸) 원문
        manualKind:
          type: string
          enum:
          - 표준
          - 실무
          - 현장조치
          - 기타
          description: '매뉴얼 종류: 표준(위기관리 표준매뉴얼)·실무(위기대응 실무매뉴얼)·현장조치(현장조치 행동매뉴얼)·기타. 지역 매뉴얼이 없어 중앙 매뉴얼을 고를 때는 표준매뉴얼을 실무매뉴얼보다 먼저 고른다'
    SopWarning:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - NO_LOCAL_ACTIONS
          - AMBIGUOUS_STEP
          - AMBIGUOUS_CODE
          - IMAGE_PAGE
          - UNMATCHED_TABLE
          - OTHER
          - IGNORED_FIELD
          - TRUNCATED
          description: '매뉴얼 처리 경고 6종(NO_LOCAL_ACTIONS·AMBIGUOUS_STEP·AMBIGUOUS_CODE·IMAGE_PAGE·UNMATCHED_TABLE·OTHER) / IGNORED_FIELD: 무시한 요청 키(message = 키 경로) / TRUNCATED: 조치 상한 초과로 잘림'
        message:
          type: string
        docId:
          type: string
          description: 경고가 난 매뉴얼(매뉴얼 처리 경고만). `manual.docId`와 같은 값
        page:
          type: integer
          description: 매뉴얼 인쇄 쪽번호(`sources[].page`와 같은 뜻)
        actionCode:
          type: string
    SopMission:
      type: object
      required:
      - missionCode
      - missionName
      - responseStep
      - actionCodes
      properties:
        missionCode:
          type: string
        missionName:
          type: string
        responseStep:
          type: string
          enum:
          - SIGN_DETECTION
          - INITIAL_RESPONSE
          - EMERGENCY_RESPONSE
          - RECOVERY
        actionCodes:
          type: array
          items:
            type: string
          description: 응답에 든 조치만
        functionCode:
          type: string
        functionName:
          type: string
        leadOrg:
          type: string
    SopAction:
      type: object
      required:
      - actionCode
      - actionName
      - missionCode
      - responseStep
      - phaseLabel
      - category
      - condition
      - summary
      - detailTasks
      - organizations
      - propagation
      - resources
      - notes
      - sources
      - phase
      - orderHint
      - alertLevel
      properties:
        actionCode:
          type: string
          description: 매뉴얼 코드 그대로(여러 코드가 한 줄이면 `3-3,3-4`)
        actionName:
          type: string
        missionCode:
          type: string
        responseStep:
          type: string
          enum:
          - SIGN_DETECTION
          - INITIAL_RESPONSE
          - EMERGENCY_RESPONSE
          - RECOVERY
        phaseLabel:
          type: string
          description: 매뉴얼 원문 단계명
        category:
          type: string
          enum:
          - NORMAL
          - DAMAGE
          description: 1~3단계 NORMAL, 4단계 수습·복구 DAMAGE
        condition:
          type: string
          description: 조치 전체에 붙은 조건 원문(R8). 있으면 「필요시 임무」
        summary:
          type: string
        detailTasks:
          type: array
          items:
            type: object
            properties:
              seq:
                type: integer
              title:
                type: string
              content:
                type: string
              note:
                type: string
        organizations:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              role:
                type: string
                enum:
                - LEAD
                - SUPPORT
                - COOPERATE
        propagation:
          type: array
          items:
            type: object
            properties:
              method:
                type: string
              target:
                type: string
              targetType:
                type: string
                nullable: true
                enum:
                - ORG
                - ROLE
                - PUBLIC
                - null
              channelHint:
                type: string
                nullable: true
                enum:
                - SMS
                - EMAIL
                - BROADCAST
                - PHONE
                - ''
                - null
              messageTemplate:
                type: string
        resources:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              quantity:
                type: number
                nullable: true
              unit:
                type: string
        notes:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: object
            properties:
              docId:
                type: string
                description: '`manual.docId`와 같은 값(원문 다운로드 `id`)'
              docTitle:
                type: string
                description: '`manual.docTitle`과 같은 표기'
              page:
                type: integer
                description: 매뉴얼에 인쇄된 쪽번호(쪽 머리글·바닥글에서 추정한 값; 쪽번호가 없는 PDF는 쪽 순번). 사람이 읽는 표기(`p.34`)용이며 PDF 뷰어 이동에는 쓰지 않는다(표지·목차 때문에 PDF 쪽과 어긋난다)
              pdfIndex:
                type: integer
                description: PDF 쪽 인덱스(0부터). 원문 위치 이동은 `GET /documents/{docId}/download?disposition=inline#page={pdfIndex + 1}`. 보고서 API `references[].page`는 1부터 세므로 그와 같은 쪽은 `pdfIndex + 1`이다
        phase:
          type: string
          enum:
          - RESPONSE
          - RECOVERY
          description: 1~3단계 RESPONSE, 4단계 RECOVERY
        orderHint:
          type: integer
          description: 응답 안의 매뉴얼 기재 순서(1부터)
        alertLevel:
          type: string
          nullable: true
          description: 위기경보 매뉴얼(ALERT_LEVEL)의 조치 경보단계. 그 외 null
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
    ErrorObject:
      type: object
      required:
      - code
      - message
      - retryable
      - retryAfter
      - requestId
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 사용자 표시용 문장. `INVALID_REQUEST`면 문제 필드 경로와 허용값을 포함한다.
        retryable:
          type: boolean
          description: 재시도 가치가 있는지
        retryAfter:
          type: integer
          nullable: true
          minimum: 0
          description: 대기 초. `RATE_LIMIT`에서는 항상 정수(상류가 값을 주지 않으면 30), 그 외 코드에서는 null.
        requestId:
          type: string
          description: '`X-Request-ID`와 같은 값. 문의 시 함께 전달.'
    ErrorCode:
      type: string
      description: 'INVALID_REQUEST(422): 스키마·매개변수 위반 / PAYLOAD_TOO_LARGE(413): 본문 1 MiB 초과 / NOT_FOUND(404): 문서·파일 없음 / RATE_LIMIT(429): 요청 한도 초과, `retryAfter` 초 후 재시도 / CTX_OVERFLOW(422): 모델 컨텍스트 초과, 절·블록 분할 필요 / SAFETY_FILTER(422): 모델이 생성 거부, 지시 순화 필요 / TIMEOUT(504): 응답 지연 / NETWORK(502): 업스트림 연결 실패 / LLM_ERROR(502): LLM 오류 / GENERATION_FAILED(502): 결과 형식 실패·빈 결과 / SERVICE_UNAVAILABLE(503): 설정 누락·의존 서비스 불가 / UNKNOWN(500): 그 외'
      enum:
      - INVALID_REQUEST
      - PAYLOAD_TOO_LARGE
      - NOT_FOUND
      - RATE_LIMIT
      - CTX_OVERFLOW
      - SAFETY_FILTER
      - TIMEOUT
      - NETWORK
      - LLM_ERROR
      - GENERATION_FAILED
      - SERVICE_UNAVAILABLE
      - UNKNOWN
    HealthResponse:
      type: object
      required:
      - app
      - version
      - status
      properties:
        app:
          type: string
        version:
          type: string
          example: 2.0.0
        status:
          type: string
          enum:
          - ok
    T3QMeta:
      type: object
      required: [requestId, traceId, generatedAt]
      properties:
        requestId: { type: string }
        traceId: { type: string, description: T3Q 내부 추적 ID }
        generatedAt: { type: string, format: date-time }
        model: { type: string, description: 참고 표시용 모델명 }
        mock: { type: boolean }
        elapsedMs: { type: integer }
    T3QError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, UNAUTHORIZED, INVALID_TOKEN, NO_DOCUMENT, NO_ALERT_CONTEXT, RATE_LIMITED, INTERNAL_ERROR, MODEL_UNAVAILABLE, TIMEOUT]
            message: { type: string }
            detail: {}
        meta:
          type: object
          properties:
            requestId: { type: string }
            traceId: { type: string }

    AuthVerifyRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, description: T3Q 링크에 붙은 1회용 토큰 }
    T3QUser:
      type: object
      required: [userId, name, orgName]
      properties:
        userId: { type: string, description: 변하지 않는 사용자 고유값 }
        loginId: { type: string, description: T3Q 로그인 아이디 (참고) }
        name: { type: string }
        orgCode: { type: string, description: "행정표준기관코드 — 부산광역시 6260000 · 경상북도 6470000" }
        orgName: { type: string }
        deptName: { type: string, description: "부서 (예: 시민안전실 자연재난과)" }
        position: { type: string, description: 직위 }
        email: { type: string }
        roles: { type: array, items: { type: string, enum: [USER, MANAGER, ADMIN] }, description: "USER 일반 · MANAGER 기관관리 (ADMIN은 반영하지 않음)" }
    AuthVerifyResponse:
      type: object
      required: [meta, user]
      properties:
        meta: { $ref: "#/components/schemas/T3QMeta" }
        user: { $ref: "#/components/schemas/T3QUser" }
        expiresAt: { type: string, format: date-time, description: T3Q 세션 만료 시각 }
