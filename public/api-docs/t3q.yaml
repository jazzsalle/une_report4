  /contacts:
    post:
      tags: [API-04 매뉴얼 연락망]
      summary: 기관 지역 → 매뉴얼 비상연락망
      description: |
        매뉴얼 고르기는 API-02 와 같습니다(재난유형 → 시군구 → 시도 → 중앙). `disasterType` 이 없으면 그 지역의 모든 매뉴얼에서 뽑아 기관·부서 단위로 합쳐 주세요.
        같은 기관·부서가 여러 매뉴얼에 있으면 **기준일이 가장 최근인 것** 하나만.
      operationId: manualContacts
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactsRequest" }
            example:
              region: { code: "2600000000", name: 부산광역시, level: SIDO }
      responses:
        "200":
          description: 매뉴얼 연락망
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactsResponse" }
              example:
                meta: { requestId: 3b7f0c2e-1d4a-4e8b-9c6f-2a5d7e9b1c04, traceId: t3q-contacts-20261005-000001, generatedAt: "2026-10-05T09:00:03+09:00" }
                manuals: [{ docId: DOC-BUSAN-FLOOD-2026, docTitle: 부산시 풍수해 재난 현장조치 행동매뉴얼, scope: SIDO, stepBasis: RESPONSE_STEP }]
                entries:
                  - { category: AGENCY, org: 부산소방재난본부, dept: 119종합상황실, title: 상황실장, phones: ["051-000-0000"], fax: ["051-000-0001"], asOf: "2026. 2월 기준", source: { docId: DOC-BUSAN-FLOOD-2026, docTitle: 부산시 풍수해 재난 현장조치 행동매뉴얼, page: 28 } }
                  - { category: INTERNAL, org: 부산광역시, dept: 자연재난과, title: 주무관, name: 홍OO, phones: ["051-000-0000"], mobile: "010-0000-0000", source: { docId: DOC-BUSAN-FLOOD-2026, docTitle: 부산시 풍수해 재난 현장조치 행동매뉴얼, page: 25 } }
                warnings: [{ code: IMAGE_PAGE, message: 유관기관 비상연락망(p.28)이 그림이라 뽑지 못했습니다., page: 28 }]
        default: { $ref: "#/components/responses/Error" }
  /auth/verify:
    post:
      tags: [API-03 사용자 인증]
      summary: 링크 토큰 확인 → 사용자 정보
      description: 우리 서버(`/sso/t3q`)가 서버 간 통신으로 호출합니다. 브라우저에서 직접 호출하지 않습니다.
      operationId: authVerify
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthVerifyRequest" }
            example: { token: "t3q-ott-8f2b0c7e4a1d4b6f9e3c" }
      responses:
        "200":
          description: 확인된 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthVerifyResponse" }
              example:
                meta: { requestId: 3b7f0c2e-1d4a-4e8b-9c6f-2a5d7e9b1c04, traceId: t3q-auth-20261005-000101, generatedAt: "2026-10-05T09:00:03+09:00" }
                user:
                  userId: U2026000123
                  loginId: hong.gildong
                  name: 홍길동
                  orgCode: "6260000"
                  orgName: 부산광역시
                  deptName: 시민안전실 자연재난과
                  position: 주무관
                  email: hong@busan.go.kr
                  roles: [USER]
                expiresAt: "2026-10-05T17:00:00+09:00"
        "401":
          description: 토큰 없음·만료·이미 사용됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/T3QError" }
              example:
                error: { code: INVALID_TOKEN, message: 만료되었거나 이미 사용된 토큰입니다. }
                meta: { requestId: 3b7f0c2e-1d4a-4e8b-9c6f-2a5d7e9b1c04, traceId: t3q-auth-20261005-000102 }
        "5XX": { $ref: "#/components/responses/Error" }

  /health:
    get:
      tags: [연계 상태]
      summary: 연계 상태 확인
      operationId: health
      responses:
        "200":
          description: 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [UP, DEGRADED, DOWN] }
                  services:
                    type: object
                    properties:
                      weather: { type: string, enum: [UP, DOWN] }
                      sop: { type: string, enum: [UP, DOWN] }
                  checkedAt: { type: string, format: date-time }
              example: { status: UP, services: { weather: UP, sop: UP }, checkedAt: "2026-07-16T14:00:00+09:00" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: T3Q 측이 발급하는 서비스 계정 토큰
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      description: 요청 추적용 UUID. 응답 meta.requestId 로 그대로 반환
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: 오류
      content:
        application/json:
          schema: { $ref: "#/components/schemas/T3QError" }
          example:
            error: { code: NO_DOCUMENT, message: 재난유형·지역에 맞는 매뉴얼이 없습니다. }
            meta: { requestId: a9f2c1d4-0e6b-4d71-8c3a-6b2f9e7d1c55, traceId: t3q-sop-20260716-000457 }
  schemas:
    WorkType:
      type: string
      enum: [REAL, DRILL]
      description: "REAL: 실제재난 / DRILL: 안전한국훈련"
    AlertLevelCode:
      type: string
      enum: [INTEREST, CAUTION, ALERT, SERIOUS]
      description: "위기경보 수준 — 관심 / 주의 / 경계 / 심각 (보고용 사실 정보)"
    ResponseStepCode:
      type: string
      enum: [SIGN_DETECTION, INITIAL_RESPONSE, EMERGENCY_RESPONSE, RECOVERY]
      description: |
        대응단계 — SOP 구성 기준
        | 코드 | 단계 | 매뉴얼 ★ 위기경보 |
        |---|---|---|
        | SIGN_DETECTION | 1단계 징후감지 | 관심·주의 |
        | INITIAL_RESPONSE | 2단계 초기대응 | 주의 |
        | EMERGENCY_RESPONSE | 3단계 비상대응 | 경계·심각 |
        | RECOVERY | 4단계 수습·복구 | 경계·심각 |
    DisasterType:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          description: |
            재난유형 코드 (10종)
            | 코드 | 재난유형 | 구분 |
            |---|---|---|
            | HEAT_WAVE | 폭염 | 자연재난 |
            | TYPHOON_HEAVY_RAIN | 태풍/호우 | 자연재난 |
            | EARTHQUAKE | 지진 | 자연재난 |
            | YELLOW_DUST | 황사 | 자연재난 |
            | WILDFIRE | 산불 | 사회재난 |
            | INFECTIOUS_DISEASE | 감염병 | 사회재난 |
            | LIVESTOCK_DISEASE | 가축질병 | 사회재난 |
            | CROWDED_BUILDING_COLLAPSE | 다중밀집건축물붕괴대형사고 | 사회재난 |
            | GOV_MAJOR_FACILITY | 정부주요시설 | 사회재난 |
            | SCHOOL_FACILITY | 학교시설 | 사회재난 |
          enum: [HEAT_WAVE, TYPHOON_HEAVY_RAIN, EARTHQUAKE, YELLOW_DUST, WILDFIRE, INFECTIOUS_DISEASE, LIVESTOCK_DISEASE, CROWDED_BUILDING_COLLAPSE, GOV_MAJOR_FACILITY, SCHOOL_FACILITY]
        name: { type: string, example: 태풍/호우 }
        group: { type: string, enum: [자연재난, 사회재난] }
    Region:
      type: object
      required: [code, name, level]
      properties:
        code: { type: string, description: "법정동 코드 10자리 — 시도 2자리+0 (예 2600000000), 시군구 5자리+0 (예 2635000000). 읍면동은 시군구 코드로 보냄" }
        name: { type: string }
        level: { type: string, enum: [SIDO, SIGUNGU, EUPMYEONDONG] }
    SituationContext:
      type: object
      description: API-02 상황정보
      required: [situationId, workType, responsibleRegion, disasterType, responseStep, baseTime]
      properties:
        situationId: { type: string, description: 우리 앱의 상황 ID }
        workType: { $ref: "#/components/schemas/WorkType" }
        responsibleRegion: { $ref: "#/components/schemas/Region" }
        affectedRegions: { type: array, items: { $ref: "#/components/schemas/Region" }, description: "발생지역 (전국 시군구·읍면동). name 은 '부산광역시 해운대구 우동' 처럼 시도부터 전체 표기" }
        disasterType: { $ref: "#/components/schemas/DisasterType" }
        alertLevel:
          $ref: "#/components/schemas/AlertLevelCode"
          description: "(선택, v1.8) 위기경보 — 매뉴얼 단계가 위기경보로 나뉜 경우에만 단계 선택에 사용. 그 외에는 상황일지용 사실 정보"
        responseStep: { $ref: "#/components/schemas/ResponseStepCode" }
        department: { type: string, example: 자연재난과, description: "(v1.9) 담당부서 원문 — 매뉴얼에서 이 부서의 행만 뽑는다(R19). 띄어쓰기 무시, 「시민안전실 자연재난과」처럼 상위 조직이 붙어도 같은 부서" }
        baseTime: { type: string, format: date-time, description: 기준시각 }
        title: { type: string, description: 상황 제목 }
        currentSituation: { type: string, description: 현재상황 (참고용 자유 텍스트, 사실로 취급하지 않음) }
        period:
          type: object
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
    T3QMeta:
      type: object
      required: [requestId, traceId, generatedAt]
      properties:
        requestId: { type: string }
        traceId: { type: string, description: T3Q 내부 추적 ID }
        generatedAt: { type: string, format: date-time }
        model: { type: string, description: 참고 표시용 모델명 }
        mock: { type: boolean }
        elapsedMs: { type: integer }
    T3QError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, UNAUTHORIZED, INVALID_TOKEN, NO_DOCUMENT, NO_ALERT_CONTEXT, RATE_LIMITED, INTERNAL_ERROR, MODEL_UNAVAILABLE, TIMEOUT]
            message: { type: string }
            detail: {}
        meta:
          type: object
          properties:
            requestId: { type: string }
            traceId: { type: string }

    SopActionsRequest:
      type: object
      required: [context]
      properties:
        context: { $ref: "#/components/schemas/SituationContext" }
        filter:
          type: object
          properties:
            phases: { type: array, items: { $ref: "#/components/schemas/ResponsePhase" } }
            categories: { type: array, items: { type: string, enum: [RESPONSE, DAMAGE] } }
            maxActions: { type: integer, default: 40 }
    ResponsePhase:
      type: string
      enum: [PREVENTION, PREPAREDNESS, RESPONSE, RECOVERY]
      description: 예방 / 대비 / 대응 / 복구
    OrgRef:
      type: object
      required: [name, role]
      properties:
        name: { type: string, example: 시민안전실 자연재난과 }
        role: { type: string, enum: [LEAD, SUPPORT, COOPERATE], description: 담당(주관) / 지원 / 협업 }
        orgCode: { type: string, description: 행정표준기관코드 (가능 시) }
        phones: { type: array, items: { type: string }, description: "(v2.0) 행동카드·프로세스 표에 붙은 그 기관·부서 번호 (예: 「울산기상대(☎ …)」, C8)" }
    DetailTask:
      type: object
      required: [seq, title, content]
      properties:
        seq: { type: integer }
        title: { type: string, description: 세부행동 (화면 세부항목) }
        content: { type: string }
        note: { type: string, description: 시점·기준 등 비고 }
    PropagationTarget:
      type: object
      required: [target, targetType]
      properties:
        target: { type: string, description: 전파대상 (참고정보 — 실제 수신자는 사용자가 연락망에서 지정) }
        method: { type: string, description: "매뉴얼 전파 표의 구분·전파방법 원문 (예: UMS — 휴대전화 문자메시지(SMS) 발송)" }
        targetType: { type: string, enum: [ORG, ROLE, PUBLIC] }
        channelHint: { type: string, enum: [SMS, EMAIL, BROADCAST, PHONE] }
        messageTemplate: { type: string, description: 전파 문안 초안 }
    ResourceNeed:
      type: object
      required: [category, name]
      properties:
        category: { type: string, description: "인력 · 장비 · 물자 · 시설" }
        name: { type: string }
        quantity: { type: number }
        unit: { type: string }
    SourceRef:
      type: object
      required: [docId, docTitle]
      properties:
        docId: { type: string }
        docTitle: { type: string }
        page: { type: integer, description: 매뉴얼 인쇄 쪽번호 }
        excerpt: { type: string, maxLength: 200 }
    SopAction:
      type: object
      description: "조치 [n-m] 1건 = 화면의 SOP 항목 1개 (매뉴얼 대응: /api-docs/mapping.html)"
      required: [actionCode, actionName, phase, category, missionCode, orderHint, organizations, detailTasks, propagation, resources, sources]
      properties:
        actionCode: { type: string, description: "매뉴얼 조치 코드번호 그대로 (예: 3-1). 같은 문서 버전이면 같은 코드" }
        actionName: { type: string, description: "조치명 — 재난대응 프로세스의 [n-m] 줄 (예: 기상특보 상황 파악)" }
        phase: { $ref: "#/components/schemas/ResponsePhase" }
        phaseLabel: { type: string, description: "매뉴얼 원문 단계명 (예: 3단계 비상대응)" }
        responseStep: { $ref: "#/components/schemas/ResponseStepCode" }
        category: { type: string, enum: [RESPONSE, DAMAGE], description: 대응조치 / 피해(복구)조치 }
        missionCode: { type: string, description: "상위 임무 [n]의 번호 (예: 3)" }
        condition: { type: string, description: "수행 조건 — 조치 전체에 붙은 (필요시)·(피해발생시)·＊태풍 북상 우려시 등 원문 그대로(R8). 제목 일부에만 붙은 조건(예: 교통통제 및 (필요시) 교통통제소 운영)은 제목에 두고 생략(R18). 값이 있으면 앱은 「필요시 임무」로 따로 배치" }
        notes: { type: array, items: { type: string }, description: "비고 — 매뉴얼의 ※·* 줄 (기호 제외), 「관심단계 참고」 같은 상속 표시" }
        linkedActionCodes: { type: array, items: { type: string }, description: "행동카드 연계코드 (범위 a ~ b 는 펼쳐서)" }
        orderHint: { type: integer, description: 매뉴얼 기재 순서 (선후행 관계 아님) }
        summary: { type: string, description: 조치 요약 → 임무내용 }
        organizations: { type: array, items: { $ref: "#/components/schemas/OrgRef" } }
        detailTasks: { type: array, items: { $ref: "#/components/schemas/DetailTask" } }
        propagation: { type: array, items: { $ref: "#/components/schemas/PropagationTarget" } }
        resources: { type: array, items: { $ref: "#/components/schemas/ResourceNeed" } }
        sources: { type: array, items: { $ref: "#/components/schemas/SourceRef" } }
    SopMission:
      type: object
      required: [missionCode, missionName, actionCodes]
      properties:
        missionCode: { type: string, description: "임무 번호 [n] (예: 3). 원문자는 숫자로 (①-1 → 1-1)" }
        missionName: { type: string, example: 기상특보 전파 }
        functionCode: { type: string, description: "협업기능 번호 (행안부 표준 ①~⑬ → 1~13). 해당 없으면 생략" }
        functionName: { type: string, example: 재난상황관리 }
        responseStep: { $ref: "#/components/schemas/ResponseStepCode" }
        leadOrg: { type: string }
        actionCodes: { type: array, items: { type: string } }
    ManualRef:
      type: object
      description: "(v1.8) T3Q가 고른 매뉴얼 — 화면에 「○○ 기준」으로 표시"
      required: [docId, docTitle, scope, stepBasis]
      properties:
        docId: { type: string }
        docTitle: { type: string, example: 영천시 풍수해 현장조치 행동매뉴얼 }
        scope: { type: string, enum: [SIGUNGU, SIDO, CENTRAL], description: "시군구 / 시도 / 중앙부처·기관 매뉴얼" }
        region: { $ref: "#/components/schemas/Region" }
        version: { type: string, description: "판·기준일 (예: 2026.7.)" }
        stepBasis: { type: string, enum: [RESPONSE_STEP, ALERT_LEVEL], description: "단계를 무엇으로 골랐는지 — 대응단계 / 위기경보" }
        departments: { type: array, items: { type: string }, example: [재난상황실, 자연재난과], description: "(v1.9) 실제로 고른 부서 칸·주관부서 원문" }
        departmentMatched: { type: boolean, description: "(v1.9) 요청 부서가 매뉴얼에 있었는지. false면 초기대응(총괄) 행으로 대신함 — 화면에 알림" }
    SopActionsResponse:
      type: object
      required: [meta, disasterType, missions, actions]
      properties:
        meta: { $ref: "#/components/schemas/T3QMeta" }
        disasterType: { $ref: "#/components/schemas/DisasterType" }
        manual: { $ref: "#/components/schemas/ManualRef" }
        warnings: { type: array, items: { $ref: "#/components/schemas/ExtractionWarning" }, description: "(v2.0) R25 예외 원칙 — 규칙으로 정할 수 없어 만들지 않은 곳" }
        missions: { type: array, items: { $ref: "#/components/schemas/SopMission" } }
        actions: { type: array, items: { $ref: "#/components/schemas/SopAction" } }
        organizationSummary:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              roles: { type: array, items: { type: string, enum: [LEAD, SUPPORT, COOPERATE] } }
              actionCodes: { type: array, items: { type: string } }

    ExtractionWarning:
      type: object
      description: "(v2.0) R25 예외 원칙 — 규칙으로 정할 수 없는 곳은 만들지 않고 원문을 두고 이유를 알림"
      required: [code, message]
      properties:
        code: { type: string, enum: [NO_LOCAL_ACTIONS, AMBIGUOUS_STEP, AMBIGUOUS_CODE, IMAGE_PAGE, UNMATCHED_TABLE, OTHER], description: "지자체 조치 없음 / 단계 판단 불가 / 코드 판단 불가 / 그림 쪽 / 표 짝 안 맞음 / 기타" }
        message: { type: string }
        docId: { type: string }
        page: { type: integer }
        actionCode: { type: string }
    ContactsRequest:
      type: object
      required: [region]
      properties:
        region: { $ref: "#/components/schemas/Region" }
        affectedRegions: { type: array, items: { $ref: "#/components/schemas/Region" } }
        disasterType: { $ref: "#/components/schemas/DisasterType" }
        documents: { type: array, items: { type: object, properties: { docId: { type: string } } } }
    ContactEntry:
      type: object
      description: 연락처 1줄 — 문서에 있으면 성명·직위·휴대전화도 그대로 (내부용)
      required: [category, org, phones, source]
      properties:
        category: { type: string, enum: [AGENCY, INTERNAL, HIGHER, LOCAL_GOV], description: "유관기관 / 자기 기관 부서 / 상급 보고처(중앙부처 상황실) / 시·도·시군구 (C7)" }
        org: { type: string, example: 부산경찰청 }
        dept: { type: string, example: 경비교통과 }
        title: { type: string, example: 경비계장 }
        name: { type: string }
        phones: { type: array, items: { type: string }, description: "사무실·대표 번호 (지역번호 붙여서, C3·C4)" }
        mobile: { type: string, description: 휴대전화 }
        fax: { type: array, items: { type: string } }
        night: { type: array, items: { type: string }, description: 야간·당직 }
        email: { type: string }
        note: { type: string, description: 비고 원문 }
        asOf: { type: string, description: "표 기준일 원문 (예: 2026. 2월 기준, C10)" }
        source: { $ref: "#/components/schemas/SourceRef" }
    ContactsResponse:
      type: object
      required: [meta, manuals, entries]
      properties:
        meta: { $ref: "#/components/schemas/T3QMeta" }
        manuals: { type: array, items: { $ref: "#/components/schemas/ManualRef" } }
        entries: { type: array, items: { $ref: "#/components/schemas/ContactEntry" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/ExtractionWarning" } }

    AuthVerifyRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, description: T3Q 링크에 붙은 1회용 토큰 }
    T3QUser:
      type: object
      required: [userId, name, orgName]
      properties:
        userId: { type: string, description: 변하지 않는 사용자 고유값 }
        loginId: { type: string, description: T3Q 로그인 아이디 (참고) }
        name: { type: string }
        orgCode: { type: string, description: "행정표준기관코드 — 부산광역시 6260000 · 경상북도 6470000" }
        orgName: { type: string }
        deptName: { type: string, description: "부서 (예: 시민안전실 자연재난과)" }
        position: { type: string, description: 직위 }
        email: { type: string }
        roles: { type: array, items: { type: string, enum: [USER, MANAGER, ADMIN] }, description: "USER 일반 · MANAGER 기관관리 (ADMIN은 반영하지 않음)" }
    AuthVerifyResponse:
      type: object
      required: [meta, user]
      properties:
        meta: { $ref: "#/components/schemas/T3QMeta" }
        user: { $ref: "#/components/schemas/T3QUser" }
        expiresAt: { type: string, format: date-time, description: T3Q 세션 만료 시각 }
