                meta: { requestId: 3b7f0c2e-1d4a-4e8b-9c6f-2a5d7e9b1c04, traceId: t3q-auth-20261005-000101, generatedAt: "2026-10-05T09:00:03+09:00" }
                user:
                  userId: U2026000123
                  loginId: hong.gildong
                  name: 홍길동
                  orgCode: "6260000"
                  orgName: 부산광역시
