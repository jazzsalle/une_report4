  /documents/{id}/download:
    servers:
    - url: https://plf.mois-disaster.t3q.ai/model-api/{apiId}
      description: API-02 납품본 (T3Q API-SOP v2)
      variables:
        apiId:
          default: 4920a
    get:
      tags:
      - API-02 SOP 콘텐츠
      operationId: downloadDocument
      summary: 매뉴얼 원문 파일
      description: '`manual.docId`(= `sources[].docId`)를 `id`로 넘겨 매뉴얼 원문(PDF)을 받는다. 보고서 API의 같은 엔드포인트(`references[].fileId`·`download`)와 동일한 URL이다. `disposition=inline`은 PDF에만 적용되며 URL 끝에 `#page=N`을 붙여 쪽으로 이동할 수 있다. 이때 N은 `sources[].pdfIndex + 1`(PDF 쪽 인덱스는 0부터, 뷰어 쪽은 1부터)이며 `sources[].page`(인쇄 쪽번호)가 아니다.'
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/Disposition'
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: 매뉴얼 원문 파일
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Content-Disposition:
              schema:
                type: string
              description: '`attachment; filename*=UTF-8''''...` 또는 `inline; ...`'
            Content-Length:
              schema:
                type: integer
                format: int64
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security: []

  /auth/verify:
    post:
