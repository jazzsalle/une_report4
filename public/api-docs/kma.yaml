openapi: 3.1.0
info:
  title: 기상청 기상특보 조회 (외부 연계)
  version: "1.0.0"
  description: |
    우리 서버가 호출하는 **기상청 기상특보 조회서비스**(공공데이터포털) 중 사용하는 3개 기능입니다.
    여기서 받은 원문을 정리해 상단 기상특보 바에 표시하고, **T3Q API-01** 요청의 `alerts`·`weatherInfoText` 로 넘깁니다.

    - 코드: `src/lib/weather/kma.ts` (10분 캐시)
    - 지점번호(stnId): 부산 **159**, 대구·경북 **143**, 전국 108
    - 인증키: 환경변수 `KMA_SERVICE_KEY` (URL 인코딩된 일반 인증키)
    - 날짜 조회 범위는 오늘 기준 최대 6일 전까지
servers:
  - url: https://apis.data.go.kr/1360000/WthrWrnInfoService
paths:
  /getPwnStatus:
    get:
      summary: 전국 특보 발효 현황
      description: "`t6`(발효 중 특보)에서 우리 지역(부산 / 경상북도·대구)이 포함된 항목만 추출합니다. `t7`은 예비특보."
      parameters:
        - $ref: "#/components/parameters/serviceKey"
        - $ref: "#/components/parameters/dataType"
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                response:
                  header: { resultCode: "00", resultMsg: NORMAL_SERVICE }
                  body:
                    items:
                      item:
                        - tmFc: 202610041830
                          tmEf: "202610042100"
                          t6: "o 강풍주의보 : 서해5도(백령도.대청도)\r\no 풍랑주의보 : 서해중부안쪽먼바다"
                          t7: "(1) 강풍 예비특보\r\no 10월 05일 새벽(00시~06시) : 충청남도(보령도서)"
                          other: "o 없음"
  /getWthrInfo:
    get:
      summary: 지점별 기상정보 본문
      description: "`t1` 본문의 (현황)·(전망) 문장을 기상 요약 재료로 씁니다."
      parameters:
        - $ref: "#/components/parameters/serviceKey"
        - $ref: "#/components/parameters/dataType"
        - $ref: "#/components/parameters/stnId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                response:
                  body:
                    items:
                      item:
                        - stnId: "159"
                          tmFc: 202610041810
                          t1: "<강수 현황과 전망>\n○ (현황) 현재(18시), 동풍의 영향으로 일부 부산에는 0.1mm 미만의 빗방울이 떨어지는 곳이 있습니다.\n○ (전망) …"
  /getWthrPwn:
    get:
      summary: 지점별 예비특보
      parameters:
        - $ref: "#/components/parameters/serviceKey"
        - $ref: "#/components/parameters/dataType"
        - $ref: "#/components/parameters/stnId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                response:
                  body:
                    items:
                      item:
                        - stnId: "159"
                          tmFc: 202610041600
                          pwn: "(1) 풍랑 예비특보\r\no 10월 05일 밤(18시~24시) : 남해동부바깥먼바다"
components:
  parameters:
    serviceKey: { name: serviceKey, in: query, required: true, schema: { type: string }, description: 공공데이터포털 인증키 }
    dataType: { name: dataType, in: query, schema: { type: string, enum: [JSON, XML], default: JSON } }
    stnId: { name: stnId, in: query, required: true, schema: { type: string, enum: ["159", "143", "108"] } }
